name: Backend CI

on:
  push:
    branches:
      - master
    paths:
      - "back/**"
      - ".github/workflows/back.yml"

  pull_request:
    branches:
      - master
    paths:
      - "back/**"
      - ".github/workflows/back.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store -d store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://store:store@localhost:5432/store_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build NestJS
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: End-to-end tests
        run: npm run test:e2e

  docker:
    name: Verify Docker image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: false
          tags: mm-store-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
