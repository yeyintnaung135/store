services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    ports:
      - '3000:3000'

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}

    restart: unless-stopped

    init: true
