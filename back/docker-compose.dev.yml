services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store -d store']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
      PORT: 3000
      CHOKIDAR_USEPOLLING: 'true'
      DATABASE_URL: postgresql://store:store@postgres:5432/store?schema=public
      JWT_SECRET: dev-only-secret
      CORS_ORIGIN: http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_dev:
